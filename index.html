<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill 导航台 · 我的 AI 工具库</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1f2329; --muted:#8a9099; --line:#e9ebef;
  --brand:#6c5ce7; --brand2:#a29bfe; --accent:#00b894; --danger:#e74c3c; --warn:#f39c12;
  --chip:#eef0f4; --chipOn:#6c5ce7; --shadow:0 2px 10px rgba(20,30,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.logo svg{width:24px;height:24px}
h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.5px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.top .spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;
  font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:42px;transition:.15s}
.btn:hover{border-color:var(--brand2)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn svg{width:17px;height:17px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 6px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:0 12px;height:46px}
.search svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
.search input{border:0;outline:0;flex:1;font-size:16px;background:transparent;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--chip);color:#3a3f47;border-radius:999px;padding:8px 13px;
  font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px;transition:.15s}
.chip svg{width:16px;height:16px}
.chip .ct{background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px;font-size:11.5px;color:#5a6068}
.chip.on{background:var(--chipOn);color:#fff;border-color:var(--chipOn)}
.chip.on .ct{background:rgba(255,255,255,.25);color:#fff}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 2px 10px}
.sec-h .bar-i{width:4px;height:18px;background:var(--brand);border-radius:3px}
.sec-h h2{font-size:17px;margin:0;font-weight:700}
.sec-h .badge{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:9px;position:relative;transition:.15s}
.card:hover{border-color:var(--brand2);transform:translateY(-2px)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.sname{font-weight:700;font-size:15px;word-break:break-all}
.s-alias{color:var(--muted);font-size:12.5px;margin-top:1px}
.acts{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.star{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:8px;color:var(--muted)}
.star.on{color:var(--warn)}
.star svg{width:19px;height:19px}
.del{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:8px;color:var(--muted)}
.del:hover{color:var(--danger)}
.del svg{width:17px;height:17px}
.s-desc{color:#5b616b;font-size:13.5px;margin:0;flex:1}
.say{margin-top:2px;border:1px dashed var(--line);background:#fafbff;color:#4a5160;border-radius:10px;
  padding:8px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:7px;text-align:left;width:100%}
.say:hover{border-color:var(--brand2);color:var(--brand)}
.say svg{width:15px;height:15px;flex:0 0 auto}
.local-badge{position:absolute;top:-8px;right:10px;background:var(--accent);color:#fff;font-size:10.5px;
  padding:1px 7px;border-radius:999px}
.empty{text-align:center;color:var(--muted);padding:50px 0;grid-column:1/-1}
footer{margin-top:34px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.8}
.svg-ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1f2329;color:#fff;
  padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-mask{position:fixed;inset:0;background:rgba(20,25,40,.45);display:none;align-items:center;justify-content:center;
  padding:18px;z-index:40}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:430px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal h3{margin:0 0 14px;font-size:17px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:#5b616b;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:15px;font-family:inherit;outline:0;background:#fff;color:var(--ink)}
.fld textarea{resize:vertical;min-height:64px}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  h1{font-size:19px}
  .top .spacer{display:none}
  .search{height:48px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="logo"><svg class="svg-ic" style="stroke:#fff"><use href="#i-mcp"/></svg></div>
    <div>
      <h1>Skill 导航台</h1>
      <div class="sub">我的 AI 工具库 · 按场景找、按分类查、一键复制提示词</div>
    </div>
    <div class="spacer"></div>
    <button class="btn primary" id="btnAdd"><svg class="svg-ic" style="stroke:#fff"><use href="#i-plus"/></svg>添加</button>
    <button class="btn" id="btnExport"><svg class="svg-ic"><use href="#i-download"/></svg>导出</button>
    <button class="btn" id="btnImport"><svg class="svg-ic"><use href="#i-upload"/></svg>导入</button>
    <input type="file" id="fileIn" accept="application/json" style="display:none">
  </header>

  <div class="bar">
    <label class="search">
      <svg class="svg-ic"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="搜工具名 / 中文名 / 功能 / 提示词…" autocomplete="off">
    </label>
  </div>

  <div class="chips" id="cats"></div>
  <div class="chips" id="scenes"></div>

  <div class="sec-h">
    <span class="bar-i"></span>
    <h2 id="listTitle">全部工具</h2>
    <span class="badge" id="listCount">0</span>
  </div>
  <div class="grid" id="grid"></div>

  <footer>
    共 <span id="total">0</span> 个工具 · 数据存于本浏览器（localStorage），换设备不会同步 ·
    「添加」仅存本机 · 想进正式库请让小台更新源码后重新发布
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="modal-mask" id="modal">
  <div class="modal">
    <h3>添加我的工具</h3>
    <div class="fld"><label>工具名（英文 id）</label><input id="f_n" placeholder="例如 my-tool"></div>
    <div class="fld"><label>中文名</label><input id="f_c" placeholder="例如 我的工具"></div>
    <div class="fld"><label>分类</label><select id="f_cat"></select></div>
    <div class="fld"><label>功能说明</label><textarea id="f_d" placeholder="一句话说明这个工具做什么"></textarea></div>
    <div class="fld"><label>提示词（可选）</label><input id="f_say" placeholder="用 xxx 帮我做…"></div>
    <div class="modal-acts">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

var CUSTOM_KEY = "wb_skillnav_custom_v1";

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function catName(id){ for(var i=0;i<CATS.length;i++){ if(CATS[i].id===id) return CATS[i].name; } return id; }
function loadArr(key){ try{ var v = JSON.parse(localStorage.getItem(key)||"[]"); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function loadCustom(){ return loadArr(CUSTOM_KEY); }
function saveCustom(a){ localStorage.setItem(CUSTOM_KEY, JSON.stringify(a)); }
function loadFav(){ return loadArr(FAV_KEY); }
function saveFav(a){ localStorage.setItem(FAV_KEY, JSON.stringify(a)); }
function isFav(n){ return loadFav().indexOf(n) >= 0; }
function allSkills(){ return SKILLS.concat(loadCustom().map(function(x){ return x; })); }

function renderCats(){
  var box = document.getElementById("cats");
  var list = allSkills();
  var buf = ['<button class="chip' + (state.cat==="all"?" on":"") + '" data-cat="all"><svg class="svg-ic"><use href="#i-search"/></svg>全部<span class="ct">'+list.length+'</span></button>'];
  var favs = loadFav().length;
  if(favs>0){ buf.push('<button class="chip'+(state.cat==="fav"?" on":"")+'" data-cat="fav"><svg class="svg-ic"><use href="#i-star"/></svg>我的收藏<span class="ct">'+favs+'</span></button>'); }
  for(var i=0;i<CATS.length;i++){
    var g = CATS[i];
    var cnt = 0;
    for(var j=0;j<list.length;j++){ if(list[j].cat===g.id) cnt++; }
    buf.push('<button class="chip'+(state.cat===g.id?" on":"")+'" data-cat="'+g.id+'"><svg class="svg-ic"><use href="#'+g.icon+'"/></svg>'+esc(g.name)+'<span class="ct">'+cnt+'</span></button>');
  }
  box.innerHTML = buf.join("");
}

}

  return '<article class="card" data-n="'+esc(s.n)+'" data-cat="'+esc(s.cat)+'">'+local+
    '<div class="card-top"><div style="min-width:0"><div class="sname">'+esc(s.n)+'</div><div class="s-alias">'+esc(s.c||"")+'</div></div>'+
    '<div class="acts"><button class="star'+(fav?" on":"")+'" data-fav="'+esc(s.n)+'" aria-label="收藏"><svg class="svg-ic"><use href="#i-star"/></svg></button>'+del+'</div></div>'+
    '<p class="s-desc">'+esc(s.d||"")+'</p>'+say+'</article>';
}
function renderGrid(){
  var list = allSkills();
  var kw = state.kw.trim().toLowerCase();
  var out = [];
  for(var i=0;i<list.length;i++){
    var s = list[i];
    if(state.cat==="fav"){ if(!isFav(s.n)) continue; }
    else if(state.cat!=="all"){ if(s.cat!==state.cat) continue; }
    if(kw){
      var hay = (s.n+" "+(s.c||"")+" "+(s.d||"")+" "+(s.say||"")).toLowerCase();
      if(hay.indexOf(kw) < 0) continue;
    }
    out.push(s);
  }
  // 收藏置顶
  out.sort(function(a,b){ return (isFav(b.n)?1:0) - (isFav(a.n)?1:0); });
  var grid = document.getElementById("grid");
  if(out.length===0){
    grid.innerHTML = '<div class="empty">没有匹配的工具，换个关键词或分类试试～</div>';
  } else {
    var buf = [];
    for(var k=0;k<out.length;k++){ buf.push(cardHTML(out[k])); }
    grid.innerHTML = buf.join("");
  }
  document.getElementById("listCount").textContent = out.length;
  document.getElementById("listTitle").textContent =
    state.cat==="fav" ? "我的收藏" : (state.cat==="all" ? "全部工具" : catName(state.cat));
}
function refreshAll(){
  renderCats();
  renderScenes();
  renderGrid();
  document.getElementById("total").textContent = allSkills().length;
}

// ---- 交互层（改数据后统一调 refreshAll） ----
function setCat(c){ state.cat=c; state.scene=null; refreshAll(); }
function setScene(i){
  var s = SCENES[i];
  state.scene = i;
  state.cat = s.cat;
  if(s.kw){ state.kw = s.kw; document.getElementById("q").value = s.kw; }
  else { state.kw=""; document.getElementById("q").value=""; }
  refreshAll();
}
function toggleFav(n){
  var f = loadFav(); var ix = f.indexOf(n);
  if(ix>=0){ f.splice(ix,1); } else { f.push(n); }
  saveFav(f); refreshAll();
}
function copySay(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast("已复制提示词"); }, function(){ toast("复制失败，请手动选择"); });
  } else { toast("当前环境不支持自动复制"); }
}
function toast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1600);
}

// ---- 绑定（事件委托，避免重复绑定） ----
function bind(){
  document.getElementById("cats").addEventListener("click", function(e){
    var b = e.target.closest("[data-cat]"); if(b){ setCat(b.getAttribute("data-cat")); }
  });
  document.getElementById("scenes").addEventListener("click", function(e){
    var b = e.target.closest("[data-scene]"); if(b){ setScene(parseInt(b.getAttribute("data-scene"),10)); }
  });
  document.getElementById("grid").addEventListener("click", function(e){
    var fav = e.target.closest("[data-fav]");
    if(fav){ toggleFav(fav.getAttribute("data-fav")); return; }
    var del = e.target.closest("[data-del]");
    if(del){ var n=del.getAttribute("data-del"); var c=loadCustom(); saveCustom(c.filter(function(x){return x.n!==n;})); refreshAll(); toast("已删除本地工具"); return; }
    var say = e.target.closest("[data-say]");
    if(say){ copySay(say.getAttribute("data-say")); }
  });
  var q = document.getElementById("q");
  q.addEventListener("input", function(){ state.kw = q.value; state.scene=null; refreshAll(); });
  document.getElementById("btnAdd").addEventListener("click", openModal);
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modal").addEventListener("click", function(e){ if(e.target.id==="modal") closeModal(); });
  document.getElementById("modalSave").addEventListener("click", saveCustomFromForm);
  document.getElementById("btnExport").addEventListener("click", exportJSON);
  document.getElementById("btnImport").addEventListener("click", function(){ document.getElementById("fileIn").click(); });
  document.getElementById("fileIn").addEventListener("change", importJSON);
  // 分类下拉
  var sel = document.getElementById("f_cat");
  for(var i=0;i<CATS.length;i++){ var o=document.createElement("option"); o.value=CATS[i].id; o.textContent=CATS[i].name; sel.appendChild(o); }
}
function openModal(){ document.getElementById("modal").classList.add("show"); }
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
function saveCustomFromForm(){
  var n = document.getElementById("f_n").value.trim();
  var c = document.getElementById("f_c").value.trim();
  var cat = document.getElementById("f_cat").value;
  var d = document.getElementById("f_d").value.trim();
  var say = document.getElementById("f_say").value.trim();
  if(!n){ toast("请填工具名"); return; }
  var cs = loadCustom();
  if(cs.some(function(x){return x.n===n;}) || SKILLS.some(function(x){return x.n===n;})){ toast("该工具名已存在"); return; }
  cs.push({ n:n, c:c, cat:cat, d:d, say:say, custom:true });
  saveCustom(cs); closeModal();
  document.getElementById("f_n").value=""; document.getElementById("f_c").value="";
  document.getElementById("f_d").value=""; document.getElementById("f_say").value="";
  refreshAll(); toast("已添加本地工具");
}
function exportJSON(){
  var data = { skills: SKILLS, custom: loadCustom(), fav: loadFav() };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "skill-nav-backup.json";
  a.click();
  toast("已导出备份");
}
function importJSON(e){
  var file = e.target.files[0]; if(!file) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var obj = JSON.parse(rd.result);
      if(obj.custom && obj.custom.length){ saveCustom(obj.custom); }
      if(obj.fav && obj.fav.length){ saveFav(obj.fav); }
      refreshAll(); toast("已导入本地数据");
    }catch(err){ toast("导入失败：文件格式错误"); }
  };
  rd.readAsText(file);
  e.target.value = "";
}

// ---- 初始化（单向：加载 -> 绑定 -> 统一刷新） ----
function boot(){
  try {
    bind();
    refreshAll();
  } catch(err){
    var g = document.getElementById("grid");
    if(g){ g.innerHTML = '<div class="empty">初始化出错：' + (err && err.message ? err.message : String(err)) + '</div>'; }
    if(typeof console !== "undefined" && console.error){ console.error(err); }
  }
}
// 兼容各种加载方式：webview/srcdoc 下 DOMContentLoaded 可能不触发，故按 readyState 兜底
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
